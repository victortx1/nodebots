<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — NodeBots</title>
<link rel="icon" type="image/png" href="fotos/favicon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="termos-gate.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="index.html"><span class="brand">Node<span class="brand-accent">Bots</span></span></a>
  </div>
</header>

<main class="auth-main wrap">
  <div class="auth-card">

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Entrar</button>
      <button class="auth-tab" data-tab="cadastro">Criar conta</button>
    </div>

    <p id="auth-erro" class="auth-erro"></p>

    <!-- ABA: LOGIN -->
    <div class="auth-panel" id="painel-login">
      <button class="btn-google" id="btn-google-login">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.96H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.04l2.97-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .98 4.96l2.97 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Entrar com Google
      </button>

      <div class="auth-divider"><span>ou com e-mail</span></div>

      <form id="form-login">
        <label>E-mail</label>
        <input type="email" id="login-email" required placeholder="seu@email.com">
        <label>Senha</label>
        <input type="password" id="login-senha" required placeholder="••••••••">
        <label class="auth-checkbox">
          <input type="checkbox" id="login-lembrar" checked>
          Manter-me conectado
        </label>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <button type="button" class="auth-link" id="btn-esqueci-senha">Esqueci minha senha</button>
      </form>
    </div>

    <!-- ABA: CADASTRO -->
    <div class="auth-panel" id="painel-cadastro" style="display:none;">
      <button class="btn-google" id="btn-google-cadastro">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.96H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.04l2.97-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .98 4.96l2.97 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Criar conta com Google
      </button>

      <div class="auth-divider"><span>ou com e-mail</span></div>

      <form id="form-cadastro">
        <label>Nome</label>
        <input type="text" id="cadastro-nome" required placeholder="Seu nome">
        <label>E-mail</label>
        <input type="email" id="cadastro-email" required placeholder="seu@email.com">
        <label>Senha</label>
        <input type="password" id="cadastro-senha" required placeholder="Mínimo 6 caracteres" minlength="6">
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>
    </div>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
<script src="termos-consentimento.js"></script>
<script src="login.js"></script>
</body>
</html>
